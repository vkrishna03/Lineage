[project]
name = "lineage-sdk"
version = "0.1.0"
description = "Python SDK for Lineage - Epistemic Transparency & Event Lineage System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic-2.0" }
authors = [{ name = "Lineage Team" }]
keywords = ["lineage", "epistemic", "transparency", "ai", "events", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage"]

[tool.ruff]
line-length = 100
target-version = "py311"
